name: Code Format
on: 
  pull_request:
    types:
      - ready_for_review
jobs:
  code-format:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v2
      - name: Format Code
        uses: AutoModality/action-ros-clang-format@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
