name: Release Candidate
on: 
  push:
    branches-ignore:
      - master
jobs:
  package:
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    strategy:
      matrix:
        os: [[x64, self-hosted,linux,build], [arm64,self-hosted,linux, build]]
      fail-fast: false
    steps:
      - uses: AutoModality/action-clean@v1.1.0
      - uses: actions/checkout@v2
      - uses: rlespinasse/github-slug-action@2.0.0 # for GITHUB_REF_SLUG
      # - name: Restore Cache
      #   uses: actions/cache@v2
      #   with:
      #     path: |
      #       catkin_ws
      #     # different caches for different architectures and control files
      #     # first element in matrix.os is the architecture, by convention
      #     key: ${{ matrix.os[0] }}-${{ env.GITHUB_REF_SLUG }}-${{ hashFiles('debian/control') }}
      - name: Package
        id: package
        uses: AutoModality/action-package-debian-ros@v5-amros
        with:
          branch: ${{ env.GITHUB_REF_SLUG }}
          build-number: ${{ github.run_number }}
          release-repo-entitlement: ${{ secrets.CLOUDSMITH_READ_RELEASE_ENTITLEMENT }}
      - name: The generated package
        run: echo "The artifact is ${{ steps.package.outputs.artifact-path }}"
      - name: Deploy
        id: deploy
        uses: AutoModality/action-cloudsmith@0.2.0
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: 'push'
          format: 'deb'
          owner: 'automodality'
          repo: 'dev'
          distro: 'ubuntu'
          release: 'bionic'
          file: '${{ steps.package.outputs.artifact-path }}'
      - name: Repo Name
        if: contains( matrix.os, 'x64' )
        run: echo ::set-env name=REPOSITORY_NAME::$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//")
      - name: Test Results
        if: contains( matrix.os, 'x64' )
        id: xunit-viewer
        uses: AutoModality/action-xunit-viewer@v1
        with: 
          results: catkin_ws/build/${{env.REPOSITORY_NAME}}/test_results/${{env.REPOSITORY_NAME}}
      - name: Attach Test Reports
        if: contains( matrix.os, 'x64' )
        uses: actions/upload-artifact@v1
        with:
          name: ${{ steps.xunit-viewer.outputs.report-name }}
          path: ${{ steps.xunit-viewer.outputs.report-dir }}
  package-cuda:
    runs-on: [arm64,self-hosted,linux, cuda]
    steps:
      - uses: actions/checkout@v2
      - uses: rlespinasse/github-slug-action@2.0.0 # for GITHUB_REF_SLUG
      - name: Package
        run: |
          # see AutoModality/action-package-debian-ros for the origin of this 
          package_name=ros-melodic-am-super
          version=${{ github.run_number }}-${{ env.GITHUB_REF_SLUG }}
          control_version_line="$package_name ($version) unstable; urgency=medium"
          echo $control_version_line > debian/changelog
          echo developer | sudo -S mk-build-deps --install --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control
          fakeroot debian/rules binary
          package_filename=$(ls *.deb | head -1)
          echo "::set-env name=PACKAGE_FILE::$package_filename"
      - name: Deploy
        id: deploy
        uses: AutoModality/action-cloudsmith@0.2.0
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: 'push'
          format: 'deb'
          owner: 'automodality'
          repo: 'dev'
          distro: 'ubuntu'
          release: 'bionic'
          file: '${{ env.PACKAGE_FILE }}'

  draft-pr:
    runs-on: ubuntu-18.04
    needs: package
    steps:
      - uses: actions/checkout@v2
      - name: Draft a Pull Request
        uses: repo-sync/pull-request@v2
        with:
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
  code-format:
    runs-on: ubuntu-18.04
    needs: package
    if: contains(github.event.head_commit.message, '/format')
    steps:
      - uses: actions/checkout@v2
      - name: Format Code
        uses: AutoModality/action-ros-clang-format@master
        env:
          GITHUB_TOKEN: ${{ secrets.AMGITBOT_PAT }} 