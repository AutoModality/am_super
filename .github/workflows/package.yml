name: Release Candidate
on: 
  push:
    branches-ignore:
      - master
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [[x64, self-hosted,linux,build], [arm64,self-hosted,linux, build]]
      fail-fast: false
    steps:
      - uses: AutoModality/action-clean@v1.1.0
      - uses: actions/checkout@v2
      - uses: rlespinasse/github-slug-action@2.0.0 # for GITHUB_REF_SLUG
      - name: Package
        id: package
        uses: AutoModality/action-package-debian-ros@v3
        with:
          branch: ${{ env.GITHUB_REF_SLUG }}
          build-number: ${{ github.run_number }}
          release-repo-entitlement: ${{ secrets.CLOUDSMITH_READ_RELEASE_ENTITLEMENT }}
      - name: The generated package
        run: echo "The artifact is ${{ steps.package.outputs.artifact-path }}"
      - name: Deploy
        id: deploy
        uses: AutoModality/action-cloudsmith@0.2.0
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: 'push'
          format: 'deb'
          owner: 'automodality'
          repo: 'dev'
          distro: 'ubuntu'
          release: 'bionic'
          file: '${{ steps.package.outputs.artifact-path }}'
      - name: Repo Name
        run: echo ::set-env name=REPOSITORY_NAME::$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//")
      - name: Generate Test Reports
        if: always()
        id: xunit-viewer
        uses: AutoModality/action-xunit-viewer@AM-337/gtest
        with: 
          results: catkin_ws/build/${{env.REPOSITORY_NAME}}/test_results/${{env.REPOSITORY_NAME}}
      - name: Attach Test Reports
        if: always()
        uses: actions/upload-artifact@v1
        with:
          name: ${{ steps.xunit-viewer.outputs.report-name }}
          path: ${{ steps.xunit-viewer.outputs.report-dir }}
      - name: Publish Test Reports to Azure Storage
        if: always()
        uses: bacongobbler/azure-blob-storage-upload@v1.0.0
        with:
          source_dir: ${{ steps.xunit-viewer.outputs.report-dir }}
          container_name: docs
          # http://tiny.cc/y1bznz
          connection_string: ${{ secrets.AMROSDOC_AZURE_STORAGE_CONNECTION_STRING }}
          extra_args: --destination-path ${{github.repository}}/test-reports
          sync: true

  draft-pr:
    runs-on: ubuntu-18.04
    needs: package
    steps:
      - uses: actions/checkout@v2
      - name: Draft a Pull Request
        uses: repo-sync/pull-request@v2
        with:
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
  code-format:
    runs-on: ubuntu-18.04
    needs: package
    steps:
      - uses: actions/checkout@v2
      - name: Format Code
        uses: AutoModality/action-ros-clang-format@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}