name: Ready for Review
on: 
  pull_request:
    types:
      - ready_for_review
jobs:
  notify-ready:
    runs-on: ubuntu-18.04
    steps:
    - name: Notify Code Format
      uses: peter-evans/repository-dispatch@v1
      with:
        token: ${{ secrets.AMGITBOT_PAT }}
        repository: ${{ github.repository }}
        event-type: ready-for-release 